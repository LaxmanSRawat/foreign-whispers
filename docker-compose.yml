services:
  # ── STT (Speech-to-Text) — GPU ──────────────────────────────────────
  whisper-gpu:
    container_name: foreign-whispers-stt
    profiles: [nvidia]
    image: ghcr.io/speaches-ai/speaches:latest-cuda-12.6.3
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - whisper-cache:/home/ubuntu/.cache/huggingface/hub
    environment:
      - WHISPER__MODEL=Systran/faster-whisper-medium
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://0.0.0.0:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── STT (Speech-to-Text) — CPU fallback ─────────────────────────────
  whisper-cpu:
    container_name: foreign-whispers-stt
    profiles: [cpu]
    platform: linux/amd64   # image has no arm64 build; Rosetta 2 emulates it on Apple Silicon
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - whisper-cache:/home/ubuntu/.cache/huggingface/hub
    environment:
      # Use a smaller model by default on CPU for acceptable speed.
      # Override with FW_WHISPER_MODEL if you need higher accuracy.
      - WHISPER__MODEL=Systran/faster-whisper-small
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://0.0.0.0:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── TTS (Text-to-Speech) — Chatterbox on GPU ───────────────────────
  chatterbox-gpu:
    container_name: foreign-whispers-tts
    profiles: [nvidia]
    image: travisvn/chatterbox-tts-api:latest
    restart: unless-stopped
    shm_size: "8gb"
    ports:
      - "8020:8020"
    environment:
      - DEVICE=cuda
      - DEFAULT_MODEL=multilingual
      - PORT=8020
    volumes:
      - chatterbox-models:/app/models
      - ./pipeline_data/speakers:/app/voices
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── TTS (Text-to-Speech) — Chatterbox on CPU ────────────────────────
  chatterbox-cpu:
    container_name: foreign-whispers-tts
    profiles: [cpu]
    platform: linux/amd64   # image has no arm64 build; Rosetta 2 emulates it on Apple Silicon
    image: travisvn/chatterbox-tts-api:latest
    restart: unless-stopped
    # Reduce shared-memory footprint; CPU inference needs far less.
    shm_size: "2gb"
    ports:
      - "8020:8020"
    environment:
      - DEVICE=cpu
      - DEFAULT_MODEL=multilingual
      - PORT=8020
    volumes:
      - chatterbox-models:/app/models
      - ./pipeline_data/speakers:/app/voices

  # ── API (CPU orchestrator) — all profiles ──────────────────────────
  # The API container is CPU-only. It delegates inference to the STT
  # and TTS containers above via HTTP.
  api:
    container_name: foreign-whispers-api
    profiles: [nvidia, cpu]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: "${UID:-1000}"
        USER_GID: "${GID:-1000}"
    restart: unless-stopped
    ports:
      - "8080:8080"
    command: ["uv", "run", "uvicorn", "api.src.main:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      # Use Docker Compose service names (not localhost) so containers
      # can reach each other inside the Compose network.
      - FW_CHATTERBOX_API_URL=http://foreign-whispers-tts:8020
      - FW_WHISPER_API_URL=http://foreign-whispers-stt:8000
      # remote = delegate to the speaches/chatterbox containers
      - FW_WHISPER_BACKEND=remote
      - FW_TTS_BACKEND=remote
    volumes:
      - ./pipeline_data:/app/pipeline_data
      - ./foreign_whispers:/app/foreign_whispers
      - ./api:/app/api
      - ./cookies.txt:/app/cookies.txt

  # ── Frontend (Next.js) — all profiles ──────────────────────────────
  frontend:
    container_name: foreign-whispers-frontend
    profiles: [nvidia, cpu]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8080
      - HOSTNAME=0.0.0.0
      - PORT=8501
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8501"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  whisper-cache:
  chatterbox-models:
